<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAI HR - Offline</title>
    <style>
        body { background: #090d16; color: #f8fafc; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 20px; }
        .card { background: #111827; border: 1px solid #1e293b; padding: 32px 24px; border-radius: 20px; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { font-size: 20px; margin: 0 0 8px; color: #38bdf8; }
        p { font-size: 13px; color: #94a3b8; line-height: 1.5; margin: 0 0 20px; }
        button { background: #0284c7; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>You are Offline</h2>
        <p>No active WiFi or Mobile Data detected. SAI HR will automatically sync your records once the connection is restored.</p>
        <button onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
